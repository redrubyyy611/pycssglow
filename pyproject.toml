[tool.poetry]
name = "pycssglow"
version = "0.1.0"
description = "A Python library for generating CSS glow effects (box-shadow and text-shadow)"
authors = ["Ruby <redrubyyy611@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/redrubyyy611/pycssglow"
repository = "https://github.com/redrubyyy611/pycssglow"
keywords = ["css", "glow", "shadow", "styling", "frontend"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]
packages = [{include = "pycssglow"}]

[tool.poetry.dependencies]
python = "^3.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
